# Generated by scripts/prepare_public_repo.py; do not edit directly.
# Hand edits in the public repo will be clobbered by the next `make publish`.
name: deterministic-validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git identity for worktree tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-go@v5
        with:
          go-version-file: fixer_mcp/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pytest
      - name: Run client_wires unit tests
        env:
          FIXER_STATE_DIR: ${{ runner.temp }}/test-state
        run: |
          set +e
          python3 -m unittest discover -s client_wires/tests > /tmp/unittest.log 2>&1
          rc=$?
          tail -60 /tmp/unittest.log
          if [ "$rc" -ne 0 ]; then
            grep -E '^(FAIL|ERROR): ' /tmp/unittest.log | sort -u | head -6 | while IFS= read -r line; do
              trace=$(grep -A30 -F "$line" /tmp/unittest.log | paste -sd' ' - | sed 's/%/%25/g')
              echo "::error title=unittest::${trace:0:200} ... ${trace: -700}"
            done
            echo "::error title=unittest summary::python3 -m unittest discover -s client_wires/tests exited ${rc}; see step log"
          fi
          exit $rc
      - name: Run Go test suites
        env:
          FIXER_STATE_DIR: ${{ runner.temp }}/test-state-go
        run: |
          set +e
          make test-go > /tmp/gotest.log 2>&1
          rc=$?
          tail -60 /tmp/gotest.log
          if [ "$rc" -ne 0 ]; then
            grep -E '(--- FAIL:|^FAIL|^panic:|^# |\.go:[0-9]+)' /tmp/gotest.log | head -40 | while IFS= read -r line; do
              echo "::error title=gotest::${line:0:400}"
            done
            echo "::error title=gotest summary::make test-go exited ${rc}; see step log"
          fi
          exit $rc
      # Builds a release from this checkout, installs it into throwaway
      # locations under $RUNNER_TEMP, then checks version identity, doctor
      # health, a clean MCP stdio initialization, and the self-update check.
      # Nothing is installed into the runner's home directory.
      - name: Run managed install verification
        run: |
          set +e
          make install-verify > /tmp/install.log 2>&1
          rc=$?
          tail -60 /tmp/install.log
          if [ "$rc" -ne 0 ]; then
            tail -40 /tmp/install.log | paste -sd' ' - | sed 's/%/%25/g' > /tmp/install_flat.txt
            flat=$(cat /tmp/install_flat.txt)
            echo "::error title=install-verify head::${flat:0:1200}"
            echo "::error title=install-verify tail::${flat: -1200}"
          fi
          exit $rc
        env:
          FIXER_MANAGED_ROOT: ${{ runner.temp }}/fixer/managed
          FIXER_STATE_DIR: ${{ runner.temp }}/fixer/state
          FIXER_USER_BIN: ${{ runner.temp }}/fixer/bin
          FIXER_CACHE_DIR: ${{ runner.temp }}/fixer/cache
      - run: make docker-smoke

# Authenticated docker-bootstrap-e2e remains an operator-run, manual gate.
